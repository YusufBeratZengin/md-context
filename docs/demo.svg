    text { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; font-size: 13px; }
  </style>

  <!-- Window frame -->
  <rect class="window" x="1" y="1" width="778" height="534" rx="10" />

  <!-- Title bar -->
  <path class="title-bar" d="M1,11 A10,10 0 0,1 11,1 L769,1 A10,10 0 0,1 779,11 L779,36 L1,36 Z" />
  <line x1="1" y1="36" x2="779" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="40" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="18" r="6" fill="#27c93f" />

  <!-- Window title -->
  <text class="title-text" x="390" y="22" text-anchor="middle">md-context — terminal</text>

  <!-- Content -->
    <text x="24" y="56"><tspan fill="#7ee787" font-weight="bold">$ </tspan><tspan fill="#f0f6fc" font-weight="bold">md-context query &quot;valve&quot; --root tests/fixtures/vault --budget 4000</tspan></text>
    <text x="24" y="76"><tspan fill="#58a6ff" font-weight="600"># Context pack</tspan></text>
    <text x="24" y="96"></text>
    <text x="24" y="116"><tspan fill="#8b949e">Query: </tspan><tspan fill="#a5d6ff">valve</tspan></text>
    <text x="24" y="136"></text>
    <text x="24" y="156"><tspan fill="#79c0ff" font-weight="600">## Valve schedule</tspan></text>
    <text x="24" y="176"></text>
    <text x="24" y="196"><tspan fill="#8b949e">Source: <tspan fill="#e3b341">`Orchard.md`</tspan></tspan></text>
    <text x="24" y="216"></text>
    <text x="24" y="236"><tspan fill="#c9d1d9">Open the east valve at sunrise. Check soil moisture before the next irrigation cycle.</tspan></text>
    <text x="24" y="256"></text>
    <text x="24" y="276"><tspan fill="#79c0ff" font-weight="600">## Orchard irrigation</tspan></text>
    <text x="24" y="296"></text>
    <text x="24" y="316"><tspan fill="#8b949e">Source: <tspan fill="#e3b341">`Orchard.md`</tspan></tspan></text>
    <text x="24" y="336"></text>
    <text x="24" y="356"><tspan fill="#c9d1d9">A fictional orchard uses drip irrigation to conserve water.</tspan></text>
    <text x="24" y="376"><tspan fill="#c9d1d9">See <tspan fill="#d2a8ff">[[Water storage]]</tspan> for the supply plan. <tspan fill="#f0883e">#planning</tspan></tspan></text>
    <text x="24" y="396"></text>
    <text x="24" y="416"><tspan fill="#79c0ff" font-weight="600">## Maintenance</tspan></text>
    <text x="24" y="436"></text>
    <text x="24" y="456"><tspan fill="#8b949e">Source: <tspan fill="#e3b341">`Orchard.md`</tspan></tspan></text>
    <text x="24" y="476"></text>
    <text x="24" y="496"><tspan fill="#c9d1d9">Inspect each filter weekly and clean sediment from the pipes.</tspan></text>
</svg>
