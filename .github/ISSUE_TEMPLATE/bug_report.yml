name: Bug report
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **WARNING: Do NOT paste private notes, credentials, or sensitive data.**
        > Provide only minimal, synthetic reproduction examples (e.g. fictitious Markdown files with placeholder text).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps and sample note content to reproduce the issue.
      placeholder: |
        1. Run CLI command: `md-context ...`
        2. With Markdown note: ...
        3. See error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and md-context version.
      value: |
        - OS: [e.g. Linux / macOS / Windows]
        - Python version: [e.g. 3.10, 3.14]
        - md-context version: [e.g. 0.1.0]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other non-sensitive context or error logs here.
    validations:
      required: false
