name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test with coverage
        run: python -m pytest
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          md-context --version
          python -c "from importlib.resources import files; assert files('md_context').joinpath('py.typed').is_file()"
      - name: Run documented quickstart on installed wheel
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          md-context index "${GITHUB_WORKSPACE}/tests/fixtures/vault" --cache-dir quickstart-cache
          md-context query "valve" --root "${GITHUB_WORKSPACE}/tests/fixtures/vault" --cache-dir quickstart-cache --budget 4000
          md-context stats --root "${GITHUB_WORKSPACE}/tests/fixtures/vault" --cache-dir quickstart-cache
