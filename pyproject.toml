[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "md-context"
version = "0.1.0"
description = "Build token-budgeted context packs from local Markdown notes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yusuf Berat Zengin"}]
keywords = [
  "markdown",
  "context",
  "llm",
  "obsidian",
  "bm25",
  "rag",
  "context-window",
  "knowledge-base",
  "notes",
  "token-budget",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/md-context"
Source = "https://github.com/YusufBeratZengin/md-context"
Changelog = "https://github.com/YusufBeratZengin/md-context/blob/main/CHANGELOG.md"
Issues = "https://github.com/YusufBeratZengin/md-context/issues"

[project.scripts]
md-context = "md_context.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14", "twine>=6.0", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/md_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=md_context --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/md_context"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/md_context"]
