[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "md-context"
version = "0.1.0"
description = "Build token-budgeted context packs from local Markdown notes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yusuf Berat Zengin"}]
keywords = ["markdown", "context", "llm", "obsidian", "bm25"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/md-context"
Issues = "https://github.com/YusufBeratZengin/md-context/issues"

[project.scripts]
md-context = "md_context.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/md_context"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/md_context"]
